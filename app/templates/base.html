<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HBntory Backoffice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px;
           margin: 40px auto; padding: 0 16px; color: #1d2430; }
    header { display: flex; justify-content: space-between;
             align-items: center; margin-bottom: 24px; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border-bottom: 1px solid #d8dde6; padding: 8px; text-align: left; }
    form.inline { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    input, button { padding: 6px 10px; font: inherit; }
    .error { background: #fde8e8; color: #9b1c1c; padding: 10px; }
  </style>
</head>
<body>
  <header>
    <strong>HBntory Backoffice</strong>
    {% if user %}
    <form method="post" action="/logout">
      {{ user.username }} ({{ user.role }})
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
